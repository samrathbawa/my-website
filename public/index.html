<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sam Bawa</title>
  <meta name="description" content="Samrath Bawa: CS student at Cal Poly Pomona. I'm rebuilding this site.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#303030">
  <link rel="canonical" href="https://sambawa.dev/">
  <meta property="og:title" content="Sam Bawa">
  <meta property="og:description" content="CS student at Cal Poly Pomona. I'm rebuilding this site.">
  <meta property="og:url" content="https://sambawa.dev/">
  <meta property="og:type" content="website">

  <script>
    // Set theme before first paint. Dark is the site's native theme.
    (function () {
      var forced = new URLSearchParams(location.search).get('theme');
      var stored = null;
      try { stored = localStorage.getItem('theme'); } catch (e) {}
      var theme = forced || stored || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300..800&family=Fragment+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23303030'/%3E%3Ctext x='50' y='67' font-size='46' text-anchor='middle' font-family='monospace' fill='%23f2f2f2'%3ESB%3C/text%3E%3C/svg%3E">
  <style>
    /* Holding page: header pinned top, message centered in the remaining height. */
    body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    .site-header { width: 100%; }
    .holding { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-block: var(--space-12); }
  </style>
</head>
<body>

  <header class="site-header">
    <a class="wordmark" href="/">sambawa<span class="tld">.dev</span></a>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light theme">
      <svg class="icon-sun" aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="icon-moon" aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>
      </svg>
    </button>
  </header>

  <main class="holding">
    <h1>Sam Bawa</h1>
    <p class="hero-intro">
      I'm rebuilding this site.
    </p>
    <ul class="hero-links">
      <li><a class="link-btn primary" href="assets/Sam%20Bawa%20Resume.pdf" download="Sam Bawa Resume.pdf">Resume<span class="arrow" aria-hidden="true"> ↓</span></a></li>
      <li><a class="link-btn" href="https://github.com/samrathbawa" target="_blank" rel="noopener noreferrer">GitHub<span class="arrow" aria-hidden="true"> ↗</span></a></li>
      <li><a class="link-btn" href="https://www.linkedin.com/in/sam-bawa/" target="_blank" rel="noopener noreferrer">LinkedIn<span class="arrow" aria-hidden="true"> ↗</span></a></li>
      <li><a class="link-btn" href="mailto:samrathbawa@outlook.com">Email</a></li>
    </ul>
  </main>

  <script>
    (function () {
      var toggle = document.getElementById('theme-toggle');
      function applyToggleLabel() {
        var dark = document.documentElement.dataset.theme === 'dark';
        toggle.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
      }
      // Hidden door: 10 theme toggles within 5 s opens the uploads dashboard.
      var toggleClicks = [];
      toggle.addEventListener('click', function () {
        var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem('theme', next); } catch (e) {}
        applyToggleLabel();

        var now = Date.now();
        toggleClicks = toggleClicks.filter(function (t) { return now - t < 5000; });
        toggleClicks.push(now);
        if (toggleClicks.length >= 10) location.href = '/dashboard/';
      });
      applyToggleLabel();
    })();
  </script>
</body>
</html>
